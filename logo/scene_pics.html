<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- QISSAH – Profilbilder aus der Video-Welt (Einzelbilder aus out/qissa_frames, 1080×1920; Bilal: dach_c Bild 30 mit 200 % -> out/logo/bilal/). Rendern: node logo/render_logos.js scene -->
<style>
  @font-face { font-family: "Amiri"; src: url("../public/fonts/amiri-arabic-700-normal.woff2"); font-weight: 700; }
  html, body { margin: 0; background: #222; }
  .logo { width: 1080px; height: 1080px; position: relative; overflow: hidden; margin-bottom: 20px; }
  .bg { position: absolute; inset: 0; background-repeat: no-repeat; filter: contrast(1.18) saturate(1.15) brightness(0.95); }
  .vig { position: absolute; inset: 0; background: radial-gradient(circle at 50% 46%, rgba(0,0,0,0) 38%, rgba(0,0,0,.55) 72%, rgba(0,0,0,.85) 100%); }
  .low { position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.78)); }
  .ar { position: absolute; left: 0; right: 0; bottom: 150px; text-align: center; font-family: "Amiri", serif; font-weight: 700;
        font-size: 150px; line-height: 1; color: #f0c25e;
        filter: drop-shadow(0 0 16px rgba(232,181,77,.55)) drop-shadow(0 4px 10px rgba(0,0,0,.8)); }
  /* Bilal von hinten auf dem Dach, Arme gehoben, Licht über dem Kopf */
  #s1 .bg { background-image: url("../out/logo/bilal/0030.png"); background-size: 1620px 2880px; background-position: -540px -600px;
            filter: contrast(1.25) saturate(1.3) brightness(0.92) sepia(.12); }
  /* Ich-Sicht: Öllampe in der dunklen Gasse */
  #s2 .bg { background-image: url("../out/qissa_frames/gasse/0040.png"); background-size: 1080px 1920px; background-position: 0 -560px; }
  #s2 .ar { bottom: auto; top: 70px; font-size: 130px; }
  /* Traum: Mondsichel, Goldstaub, Licht über dem Kopf */
  #s3 .bg { background-image: url("../out/qissa_frames/traum/0600.png"); background-size: 1080px 1920px; background-position: 0 -120px; }
  #s3 .ar { bottom: auto; top: 70px; font-size: 130px; }
</style>
</head>
<body>
<div class="logo" id="s1"><div class="bg"></div><div class="vig"></div><div class="ar" style="bottom:auto;top:70px;font-size:130px">قصة</div></div>
<div class="logo" id="s2"><div class="bg"></div><div class="vig"></div><div class="ar">قصة</div></div>
<div class="logo" id="s3"><div class="bg"></div><div class="vig"></div><div class="ar">قصة</div></div>
</body>
</html>
