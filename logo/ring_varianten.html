<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- QISSAH – Profilbild mit leuchtendem Gold-Doppelring (Nutzer-Vorbild: Neon-Ring am Rand, Schrift innen), 2D.
     Rendern: node logo/render_html.js logo/ring_varianten.html qissah-ring  -> out/logo/qissah-ring-<n>.png -->
<style>
  @font-face { font-family: "EB Garamond"; src: url("../public/fonts/eb-garamond-latin-600-normal.woff2"); font-weight: 600; }
  @font-face { font-family: "Amiri"; src: url("../public/fonts/amiri-arabic-700-normal.woff2"); font-weight: 700; }
  @font-face { font-family: "Cinzel"; src: url("fonts/cinzel-latin-700-normal.woff2"); font-weight: 700; }
  @font-face { font-family: "League Gothic"; src: url("fonts/league-gothic-latin-400-normal.woff2"); }
  @font-face { font-family: "Antonio"; src: url("fonts/antonio-latin-400-normal.woff2"); font-weight: 400; }
  @font-face { font-family: "Antonio"; src: url("fonts/antonio-latin-600-normal.woff2"); font-weight: 600; }
  :root { --gold: #f0bf55; }
  html, body { margin: 0; background: #222; }
  .logo { width: 1080px; height: 1080px; position: relative; overflow: hidden; margin-bottom: 20px; background: #030304; }
  .c { position: absolute; left: 0; right: 0; text-align: center; line-height: 1; color: var(--gold); }
  .soft { filter: drop-shadow(0 0 10px rgba(240,191,85,.45)); }
  svg.ring { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<!-- Ring-Vorlage (in jede Variante kopiert): zwei Neon-Ringe nah am Rand, Kern hell, außen Leuchten -->

<!-- 1 Q + QISSAH (Garamond + Mono) im Doppelring -->
<div class="logo" id="r1">
  <svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c soft" style="top:175px;font-family:'EB Garamond';font-weight:600;font-size:500px;padding-left:28px">Q</div>
  <div class="c soft" style="top:745px;font-family:'JetBrains Mono';font-weight:700;font-size:66px;letter-spacing:20px;padding-left:20px">QISSAH</div>
</div>

<!-- 2 QISSAH hoch und schmal wie im Vorbild -->
<div class="logo" id="r2">
  <svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c soft" style="top:345px;font-family:'League Gothic';font-size:380px;letter-spacing:5px">QISSAH</div>
</div>

<!-- 3 QISSAH schmal + kleines arabisches Wort darüber -->
<div class="logo" id="r3">
  <svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c soft" style="top:250px;font-family:Amiri;font-weight:700;font-size:130px">قصة</div>
  <div class="c soft" style="top:425px;font-family:Antonio;font-weight:600;font-size:270px;letter-spacing:3px">QISSAH</div>
</div>

<!-- 4 nur das große Q -->
<div class="logo" id="r4">
  <svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c soft" style="top:215px;font-family:'EB Garamond';font-weight:600;font-size:560px;padding-left:20px">Q</div>
</div>

<!-- 5 Q + QISSAH in römischen Großbuchstaben -->
<div class="logo" id="r5">
  <svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c soft" style="top:200px;font-family:Cinzel;font-weight:700;font-size:430px;padding-right:60px">Q</div>
  <div class="c soft" style="top:720px;font-family:Cinzel;font-weight:700;font-size:78px;letter-spacing:18px;padding-left:18px">QISSAH</div>
</div>

<!-- 6 Q mit Mondsichel + QISSAH -->
<div class="logo" id="r6">
  <svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c soft" style="top:175px;font-family:'EB Garamond';font-weight:600;font-size:500px;padding-left:28px">Q</div>
  <svg class="ring soft" width="1080" height="1080">
    <defs><mask id="m6"><rect width="1080" height="1080" fill="white"/><circle cx="566" cy="400" r="52" fill="black"/></mask></defs>
    <circle cx="540" cy="415" r="59" fill="#f8d98f" mask="url(#m6)"/>
    <path d="M589 455 l5 14 14 5 -14 5 -5 14 -5 -14 -14 -5 14 -5z" fill="#f8d98f"/>
  </svg>
  <div class="c soft" style="top:745px;font-family:'JetBrains Mono';font-weight:700;font-size:66px;letter-spacing:20px;padding-left:20px">QISSAH</div>
</div>

<!-- gemeinsame Ringe -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="rings">
      <g filter="url(#neon)" fill="none">
        <circle cx="540" cy="540" r="497" stroke="#e9a93a" stroke-width="13"/>
        <circle cx="540" cy="540" r="470" stroke="#e9a93a" stroke-width="9"/>
      </g>
      <g fill="none">
        <circle cx="540" cy="540" r="497" stroke="#fff0c2" stroke-width="4"/>
        <circle cx="540" cy="540" r="470" stroke="#fff0c2" stroke-width="3"/>
      </g>
    </g>
  </defs>
</svg>
</body>
</html>
