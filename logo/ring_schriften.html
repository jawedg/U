<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- QISSAH – Goldring + Q + QISSAH in verschiedenen edlen Schriften (Nutzer: Ring ja, schmale Schrift aus dem Vorbild nein).
     Rendern: node logo/render_html.js logo/ring_schriften.html qissah-schrift -> out/logo/qissah-schrift-<n>.png -->
<style>
  @font-face { font-family: "EB Garamond"; src: url("../public/fonts/eb-garamond-latin-600-normal.woff2"); font-weight: 600; }
  @font-face { font-family: "Cormorant"; src: url("fonts/cormorant-garamond-latin-600-normal.woff2"); font-weight: 600; }
  @font-face { font-family: "Cormorant"; src: url("fonts/cormorant-garamond-latin-700-normal.woff2"); font-weight: 700; }
  @font-face { font-family: "Cinzel"; src: url("fonts/cinzel-latin-700-normal.woff2"); font-weight: 700; }
  @font-face { font-family: "Cinzel"; src: url("fonts/cinzel-latin-600-normal.woff2"); font-weight: 600; }
  @font-face { font-family: "Cinzel Decorative"; src: url("fonts/cinzel-decorative-latin-700-normal.woff2"); font-weight: 700; }
  @font-face { font-family: "Playfair"; src: url("fonts/playfair-display-latin-700-normal.woff2"); font-weight: 700; }
  @font-face { font-family: "Bodoni"; src: url("fonts/bodoni-moda-latin-700-normal.woff2"); font-weight: 700; }
  @font-face { font-family: "Bodoni"; src: url("fonts/bodoni-moda-latin-600-normal.woff2"); font-weight: 600; }
  @font-face { font-family: "Montserrat"; src: url("fonts/montserrat-latin-500-normal.woff2"); font-weight: 500; }
  @font-face { font-family: "Montserrat"; src: url("fonts/montserrat-latin-600-normal.woff2"); font-weight: 600; }
  @font-face { font-family: "Marcellus"; src: url("fonts/marcellus-latin-400-normal.woff2"); font-weight: 400; }
  :root { --gold: #f0bf55; }
  html, body { margin: 0; background: #222; }
  .logo { width: 1080px; height: 1080px; position: relative; overflow: hidden; margin-bottom: 20px;
          background: radial-gradient(circle at 50% 45%, #14110b 0%, #030304 60%); }
  .c { position: absolute; left: 0; right: 0; text-align: center; line-height: 1; color: var(--gold);
       filter: drop-shadow(0 0 10px rgba(240,191,85,.42)); }
  .q { top: 165px; font-size: 500px; }
  .n { top: 745px; font-size: 76px; letter-spacing: 20px; padding-left: 20px; }
  svg.ring { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>

<!-- 1 EB Garamond (das Q, das gefiel) + QISSAH in derselben Schrift -->
<div class="logo" id="s1"><svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c q" style="font-family:'EB Garamond';font-weight:600;padding-left:28px">Q</div>
  <div class="c n" style="font-family:'EB Garamond';font-weight:600;font-size:84px">QISSAH</div></div>

<!-- 2 Cormorant Garamond: sehr elegant, feine Serifen -->
<div class="logo" id="s2"><svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c q" style="font-family:Cormorant;font-weight:700;font-size:540px;top:150px;padding-left:24px">Q</div>
  <div class="c n" style="font-family:Cormorant;font-weight:700;font-size:88px">QISSAH</div></div>

<!-- 3 Cinzel: wie in Stein gemeißelt (römisch, historisch) -->
<div class="logo" id="s3"><svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c q" style="font-family:Cinzel;font-weight:700;font-size:420px;top:205px;padding-right:50px">Q</div>
  <div class="c n" style="font-family:Cinzel;font-weight:600;font-size:74px">QISSAH</div></div>

<!-- 4 Cinzel Decorative: verziertes Q -->
<div class="logo" id="s4"><svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c q" style="font-family:'Cinzel Decorative';font-weight:700;font-size:390px;top:215px;padding-right:110px">Q</div>
  <div class="c n" style="font-family:Cinzel;font-weight:600;font-size:74px">QISSAH</div></div>

<!-- 5 Bodoni: Luxus-Marke (starker Kontrast dick/dünn) + moderne Schrift darunter -->
<div class="logo" id="s5"><svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c q" style="font-family:Bodoni;font-weight:700;font-size:470px;top:160px;padding-left:10px">Q</div>
  <div class="c n" style="font-family:Montserrat;font-weight:600;font-size:62px;letter-spacing:26px;padding-left:26px;top:770px">QISSAH</div></div>

<!-- 6 Playfair: edel, kräftig -->
<div class="logo" id="s6"><svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c q" style="font-family:Playfair;font-weight:700;font-size:470px;top:180px;padding-left:16px">Q</div>
  <div class="c n" style="font-family:Playfair;font-weight:700;font-size:76px">QISSAH</div></div>

<!-- 7 Marcellus: klassisch, ruhig, sehr gut lesbar -->
<div class="logo" id="s7"><svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c q" style="font-family:Marcellus;font-size:470px;top:185px;padding-left:10px">Q</div>
  <div class="c n" style="font-family:Marcellus;font-size:80px">QISSAH</div></div>

<!-- 8 EB-Garamond-Q + moderne Schrift (klar, wie große Marken) -->
<div class="logo" id="s8"><svg class="ring" width="1080" height="1080"><use href="#rings"/></svg>
  <div class="c q" style="font-family:'EB Garamond';font-weight:600;padding-left:28px">Q</div>
  <div class="c n" style="font-family:Montserrat;font-weight:500;font-size:60px;letter-spacing:28px;padding-left:28px">QISSAH</div></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="rings">
      <g filter="url(#neon)" fill="none">
        <circle cx="540" cy="540" r="497" stroke="#e9a93a" stroke-width="13"/>
        <circle cx="540" cy="540" r="470" stroke="#e9a93a" stroke-width="9"/>
      </g>
      <g fill="none">
        <circle cx="540" cy="540" r="497" stroke="#fff0c2" stroke-width="4"/>
        <circle cx="540" cy="540" r="470" stroke="#fff0c2" stroke-width="3"/>
      </g>
    </g>
  </defs>
</svg>
</body>
</html>
