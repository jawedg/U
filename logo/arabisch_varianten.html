<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- QISSAH – Goldring-Profilbilder „mehr arabisch angehaucht“ (Nutzer): Schriften mit arabisch gestalteten lateinischen Buchstaben
     (Reem Kufi, Aref Ruqaa, El Messiri, Marhey), 8-Zacken-Stern (Rub al-Hizb), islamisches Sternmuster, Torbogen.
     Rendern: node logo/render_html.js logo/arabisch_varianten.html qissah-arab -> out/logo/qissah-arab-<n>.png -->
<style>
  @font-face { font-family: "EB Garamond"; src: url("../public/fonts/eb-garamond-latin-600-normal.woff2"); font-weight: 600; }
  @font-face { font-family: "Kufi"; src: url("fonts/reem-kufi-latin-700-normal.woff2"); font-weight: 700; unicode-range: U+0000-024F; }
  @font-face { font-family: "Kufi"; src: url("fonts/reem-kufi-arabic-700-normal.woff2"); font-weight: 700; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Kufi"; src: url("fonts/reem-kufi-latin-600-normal.woff2"); font-weight: 600; unicode-range: U+0000-024F; }
  @font-face { font-family: "Messiri"; src: url("fonts/el-messiri-latin-600-normal.woff2"); font-weight: 600; unicode-range: U+0000-024F; }
  @font-face { font-family: "Messiri"; src: url("fonts/el-messiri-latin-700-normal.woff2"); font-weight: 700; unicode-range: U+0000-024F; }
  @font-face { font-family: "Messiri"; src: url("fonts/el-messiri-arabic-700-normal.woff2"); font-weight: 700; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Ruqaa"; src: url("fonts/aref-ruqaa-latin-700-normal.woff2"); font-weight: 700; unicode-range: U+0000-024F; }
  @font-face { font-family: "Ruqaa"; src: url("fonts/aref-ruqaa-arabic-700-normal.woff2"); font-weight: 700; unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: "Marhey"; src: url("fonts/marhey-latin-700-normal.woff2"); font-weight: 700; unicode-range: U+0000-024F; }
  :root { --gold: #f0bf55; }
  html, body { margin: 0; background: #222; }
  .logo { width: 1080px; height: 1080px; position: relative; overflow: hidden; margin-bottom: 20px;
          background: radial-gradient(circle at 50% 45%, #15110a 0%, #030304 62%); }
  .c { position: absolute; left: 0; right: 0; text-align: center; line-height: 1; color: var(--gold);
       filter: drop-shadow(0 0 10px rgba(240,191,85,.42)); }
  svg.full { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>

<!-- 1 Q im 8-Zacken-Stern (Rub al-Hizb) -->
<div class="logo" id="a1">
  <svg class="full" width="1080" height="1080"><use href="#geoBg" opacity=".07"/><use href="#rings"/>
    <g fill="none" stroke="#f0bf55" filter="url(#soft)">
      <rect x="333" y="263" width="414" height="414" stroke-width="6"/>
      <rect x="333" y="263" width="414" height="414" stroke-width="6" transform="rotate(45 540 470)"/>
      <rect x="353" y="283" width="374" height="374" stroke-width="2" opacity=".55"/>
      <rect x="353" y="283" width="374" height="374" stroke-width="2" opacity=".55" transform="rotate(45 540 470)"/>
    </g></svg>
  <div class="c" style="top:318px;font-family:'EB Garamond';font-weight:600;font-size:280px;padding-left:4px">Q</div>
  <div class="c" style="top:790px;font-family:Messiri;font-weight:700;font-size:72px;letter-spacing:16px;padding-left:16px">QISSAH</div>
</div>

<!-- 2 Kufi-Schrift (eckig wie alte Moschee-Inschriften) + Sternmuster -->
<div class="logo" id="a2">
  <svg class="full" width="1080" height="1080"><use href="#geoBg" opacity=".11"/><use href="#rings"/></svg>
  <div class="c" style="top:185px;font-family:Kufi;font-weight:700;font-size:470px">Q</div>
  <div class="c" style="top:745px;font-family:Kufi;font-weight:600;font-size:84px;letter-spacing:16px;padding-left:16px">QISSAH</div>
</div>

<!-- 3 Ruqaa: lateinische Buchstaben im Stil arabischer Schönschrift -->
<div class="logo" id="a3">
  <svg class="full" width="1080" height="1080"><use href="#geoBg" opacity=".07"/><use href="#rings"/></svg>
  <div class="c" style="top:150px;font-family:Ruqaa;font-weight:700;font-size:500px">Q</div>
  <div class="c" style="top:735px;font-family:Ruqaa;font-weight:700;font-size:110px;letter-spacing:6px">Qissah</div>
</div>

<!-- 4 das arabische Wort groß in Schönschrift (Ruqaa) + QISSAH -->
<div class="logo" id="a4">
  <svg class="full" width="1080" height="1080"><use href="#geoBg" opacity=".07"/><use href="#rings"/></svg>
  <div class="c" style="top:250px;font-family:Ruqaa;font-weight:700;font-size:330px">قصة</div>
  <div class="c" style="top:720px;font-family:Messiri;font-weight:700;font-size:78px;letter-spacing:18px;padding-left:18px">QISSAH</div>
</div>

<!-- 5 Torbogen (Mihrab) mit Stern + Q -->
<div class="logo" id="a5">
  <svg class="full" width="1080" height="1080"><use href="#geoBg" opacity=".06"/><use href="#rings"/>
    <g fill="none" stroke="#f0bf55" filter="url(#soft)">
      <path d="M318 760 L318 470 C318 340 430 270 540 190 C650 270 762 340 762 470 L762 760" stroke-width="6"/>
      <path d="M344 760 L344 474 C344 355 446 290 540 222 C634 290 736 355 736 474 L736 760" stroke-width="2" opacity=".55"/>
    </g>
    <g transform="translate(540 160)" fill="#f8d98f" filter="url(#soft)">
      <rect x="-15" y="-15" width="30" height="30"/><rect x="-15" y="-15" width="30" height="30" transform="rotate(45)"/></g></svg>
  <div class="c" style="top:345px;font-family:'EB Garamond';font-weight:600;font-size:330px;padding-left:4px">Q</div>
  <div class="c" style="top:800px;font-family:Messiri;font-weight:700;font-size:68px;letter-spacing:16px;padding-left:16px">QISSAH</div>
</div>

<!-- 6 Q + kleines arabisches Wort, ganzes Sternmuster im Ring -->
<div class="logo" id="a6">
  <svg class="full" width="1080" height="1080"><use href="#geoBg" opacity=".16"/>
    <circle cx="540" cy="520" r="300" fill="url(#hole)"/><use href="#rings"/></svg>
  <div class="c" style="top:190px;font-family:Ruqaa;font-weight:700;font-size:120px">قصة</div>
  <div class="c" style="top:300px;font-family:'EB Garamond';font-weight:600;font-size:400px;padding-left:24px">Q</div>
  <div class="c" style="top:790px;font-family:Messiri;font-weight:700;font-size:66px;letter-spacing:16px;padding-left:16px">QISSAH</div>
</div>

<!-- 7 Arabisch in Kufi + QISSAH in Kufi -->
<div class="logo" id="a7">
  <svg class="full" width="1080" height="1080"><use href="#geoBg" opacity=".08"/><use href="#rings"/></svg>
  <div class="c" style="top:255px;font-family:Kufi;font-weight:700;font-size:300px">قصة</div>
  <div class="c" style="top:705px;font-family:Kufi;font-weight:600;font-size:86px;letter-spacing:16px;padding-left:16px">QISSAH</div>
</div>

<!-- 8 Marhey: lateinische Buchstaben mit arabischem Schwung -->
<div class="logo" id="a8">
  <svg class="full" width="1080" height="1080"><use href="#geoBg" opacity=".07"/><use href="#rings"/></svg>
  <div class="c" style="top:200px;font-family:Marhey;font-weight:700;font-size:420px">Q</div>
  <div class="c" style="top:735px;font-family:Marhey;font-weight:700;font-size:92px;letter-spacing:8px;padding-left:8px">QISSAH</div>
</div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="22" result="b2"/>
      <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="hole"><stop offset="0" stop-color="#050505" stop-opacity=".95"/><stop offset=".7" stop-color="#050505" stop-opacity=".8"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0"/></radialGradient>
    <!-- islamisches Sternmuster: 8-Zacken-Sterne mit Verbindungslinien -->
    <pattern id="geo" width="120" height="120" patternUnits="userSpaceOnUse" x="0" y="0">
      <g stroke="#f0bf55" stroke-width="2.2" fill="none">
        <rect x="35" y="35" width="50" height="50"/><rect x="35" y="35" width="50" height="50" transform="rotate(45 60 60)"/>
        <path d="M0 0 L25 25 M120 0 L95 25 M0 120 L25 95 M120 120 L95 95 M60 0 L60 25 M60 120 L60 95 M0 60 L25 60 M120 60 L95 60"/>
      </g>
    </pattern>
    <clipPath id="inner"><circle cx="540" cy="540" r="458"/></clipPath>
    <g id="geoBg"><rect width="1080" height="1080" fill="url(#geo)" clip-path="url(#inner)"/></g>
    <g id="rings">
      <g filter="url(#neon)" fill="none">
        <circle cx="540" cy="540" r="497" stroke="#e9a93a" stroke-width="13"/>
        <circle cx="540" cy="540" r="470" stroke="#e9a93a" stroke-width="9"/>
      </g>
      <g fill="none">
        <circle cx="540" cy="540" r="497" stroke="#fff0c2" stroke-width="4"/>
        <circle cx="540" cy="540" r="470" stroke="#fff0c2" stroke-width="3"/>
      </g>
    </g>
  </defs>
</svg>
</body>
</html>
